<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Footwear — Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23B3202C%22%2F%3E%3Ctext%20x%3D%2216%22%20y%3D%2222%22%20font-family%3D%22Helvetica%2CArial%2Csans-serif%22%20font-size%3D%2214%22%20font-weight%3D%22bold%22%20fill%3D%22%23FFFFFF%22%20text-anchor%3D%22middle%22%3ESF%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brandmark">
      <span class="brandmark-badge">SF</span>
      <span class="brandmark-text">
        <span class="brandmark-name">Sample Footwear</span>
        <span class="brandmark-role" id="whoami">Office</span>
      </span>
    </div>
    <div class="topbar-right">
      <span class="topbar-date" id="todayDate"></span>
      <button class="signout" id="signOutBtn">Sign out</button>
    </div>
  </div>
</header>

<div class="tabs-wrap">
  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-tab="sales">Sales</button>
    <button class="tab" data-tab="purchase">Purchase</button>
    <button class="tab" data-tab="orders">
      Order
      <span class="tab-badge" id="ordersBadge" hidden>0</span>
    </button>
    <button class="tab" data-tab="admin">Administration</button>
  </nav>
</div>

<main>

  <!-- ================= SALES =================
       Three numbers, then one picture at a time. The dropdown swaps
       what the chart shows rather than stacking every view down the
       page, which is what made this screen hard to take in.
  -->
  <section class="panel" id="panel-sales">

    <div class="section">
      <div class="figures">
        <div class="figure">
          <span class="label">Order book</span>
          <div class="figure-value num" id="kpiBookValue">—</div>
          <div class="figure-note" id="kpiBookNote"></div>
        </div>
        <div class="figure">
          <span class="label">Waiting for you</span>
          <div class="figure-value num" id="kpiPending">—</div>
          <div class="figure-note" id="kpiPendingNote"></div>
        </div>
        <div class="figure">
          <span class="label">Money owed to us</span>
          <div class="figure-value num" id="kpiOutstanding">—</div>
          <div class="figure-note" id="kpiOutstandingNote"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="pickrow">
        <label class="pickrow-label" for="salesView">Show me</label>
        <select id="salesView">
          <option value="stage">Orders by stage</option>
          <option value="salesman">Orders by salesman</option>
          <option value="dealer">Orders by dealer</option>
          <option value="credit">Credit used by each dealer</option>
        </select>
      </div>

      <figure class="chart">
        <div class="chart-rows" id="salesChart"></div>
        <p class="chart-note" id="salesNote"></p>
      </figure>
    </div>

  </section>

  <!-- ================= PURCHASE ================= -->
  <section class="panel" id="panel-purchase" hidden>

    <div class="section">
      <div class="figures">
        <div class="figure">
          <span class="label">Open orders</span>
          <div class="figure-value num" id="kpiOpenPo">—</div>
          <div class="figure-note" id="kpiOpenPoNote"></div>
        </div>
        <div class="figure">
          <span class="label">Money committed</span>
          <div class="figure-value num" id="kpiPoValue">—</div>
          <div class="figure-note">On orders not yet closed</div>
        </div>
        <div class="figure">
          <span class="label">Need reordering</span>
          <div class="figure-value num" id="kpiReorder">—</div>
          <div class="figure-note" id="kpiReorderNote"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="pickrow">
        <label class="pickrow-label" for="purchaseView">Show me</label>
        <select id="purchaseView">
          <option value="material">What needs buying</option>
          <option value="orders">Purchase orders</option>
          <option value="supplier">Spend by supplier</option>
        </select>
      </div>

      <figure class="chart">
        <div class="chart-rows" id="purchaseChart"></div>
        <p class="chart-note" id="purchaseNote"></p>
      </figure>

      <div class="table-scroll" id="poTableWrap" hidden>
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Supplier</th>
              <th>Value</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="poBody"></tbody>
        </table>
      </div>
    </div>

  </section>

  <!-- ================= ORDER — the approval desk =================
       One list, not two. The dropdown starts on the orders that need
       a decision, and Approve / Reject sit on the card itself so
       nothing has to be opened first.
  -->
  <section class="panel" id="panel-orders" hidden>

    <div class="section">
      <div class="pickrow">
        <label class="pickrow-label" for="orderView">Show me</label>
        <select id="orderView"></select>
        <span class="pickrow-count" id="orderCount"></span>
      </div>

      <p class="queue-lead" id="queueLead" hidden></p>

      <div class="ord-list" id="ordList"></div>
      <p class="picker-none" id="ordNone" hidden>Nothing here.</p>
    </div>

  </section>

  <!-- ================= ADMINISTRATION ================= -->
  <section class="panel" id="panel-admin" hidden>

    <div class="section">
      <div class="pickrow">
        <label class="pickrow-label" for="adminView">Show me</label>
        <select id="adminView">
          <option value="users">Staff and their logins</option>
          <option value="dealers">Dealer credit limits</option>
          <option value="brands">Our brands</option>
        </select>
      </div>

      <div class="table-scroll">
        <table>
          <thead><tr id="adminHead"></tr></thead>
          <tbody id="adminBody"></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2 class="section-title">Start the demo again</h2>
      </div>
      <p class="hint" id="demoDataNote"></p>
      <div class="submit-row">
        <button class="btn-ghost" id="resetDemoBtn">Reset all orders</button>
      </div>
    </div>

  </section>

</main>

<!-- live word of a change made in another tab -->
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/office.js"></script>
</body>
</html>
